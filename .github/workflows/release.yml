name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same check installs make: an annotated tag signed by a key in scripts/release-signers.
      # (Installs read that file from the version they already run; here it comes from the tag.)
      - name: the tag must be signed by a release key
        run: |
          git fetch --no-tags --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          scripts/verify-release.sh scripts/release-signers "$GITHUB_REF_NAME"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm test && npm run build
      - name: the tag must match package.json and have a CHANGELOG section
        run: |
          pkg=$(node -p 'require("./package.json").version')
          test "v$pkg" = "$GITHUB_REF_NAME" || { echo "package.json is $pkg but the tag is $GITHUB_REF_NAME"; exit 1; }
          grep -q "^## \[\?v\?${pkg}" CHANGELOG.md || { echo "CHANGELOG.md has no '## $pkg' section"; exit 1; }
      - name: build the menu bar app
        run: |
          menubar/build.sh build
          ditto -c -k --keepParent menubar/build/Clawdbox.app "Clawdbox.app-${GITHUB_REF_NAME}.zip"
      - name: pack the npm tarball
        run: npm pack && mv clawdbox-*.tgz "clawdbox-${GITHUB_REF_NAME}.tgz"
      - name: checksums
        run: shasum -a 256 "Clawdbox.app-${GITHUB_REF_NAME}.zip" "clawdbox-${GITHUB_REF_NAME}.tgz" install.sh > SHA256SUMS && cat SHA256SUMS
      # Anyone can check a download came from this workflow: gh attestation verify FILE --repo edmerrett/clawdbox
      - name: build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Clawdbox.app-${{ github.ref_name }}.zip
            clawdbox-${{ github.ref_name }}.tgz
            install.sh
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=$(node -p 'require("./package.json").version')
          notes=$(awk -v v="$pkg" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" \
            --title "clawdbox $GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md.}" \
            "Clawdbox.app-${GITHUB_REF_NAME}.zip" "clawdbox-${GITHUB_REF_NAME}.tgz" SHA256SUMS
