name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm test && npm run build
      - name: the tag must match package.json and have a CHANGELOG section
        run: |
          pkg=$(node -p 'require("./package.json").version')
          test "v$pkg" = "$GITHUB_REF_NAME" || { echo "package.json is $pkg but the tag is $GITHUB_REF_NAME"; exit 1; }
          grep -q "^## \[\?v\?${pkg}" CHANGELOG.md || { echo "CHANGELOG.md has no '## $pkg' section"; exit 1; }
      - name: build the menu bar app
        run: |
          menubar/build.sh build
          ditto -c -k --keepParent menubar/build/Clawdbar.app "Clawdbar-${GITHUB_REF_NAME}.zip"
      - name: pack the npm tarball
        run: npm pack && mv clawdbox-*.tgz "clawdbox-${GITHUB_REF_NAME}.tgz"
      - name: checksums
        run: shasum -a 256 "Clawdbar-${GITHUB_REF_NAME}.zip" "clawdbox-${GITHUB_REF_NAME}.tgz" install.sh > SHA256SUMS && cat SHA256SUMS
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=$(node -p 'require("./package.json").version')
          notes=$(awk -v v="$pkg" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" \
            --title "clawdbox $GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md.}" \
            "Clawdbar-${GITHUB_REF_NAME}.zip" "clawdbox-${GITHUB_REF_NAME}.tgz" SHA256SUMS
