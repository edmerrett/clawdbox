name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # bluetooth-serial-port is optional and needs a Bluetooth stack to build; skip it in CI
      - run: npm ci --no-optional --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js send idle --mock
  python:
    name: bridge (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r bridge/requirements.txt ruff
      - run: ruff check bridge
      - run: python -m py_compile bridge/clawdbox_ble.py
  swift:
    name: menu bar app builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: menubar/build.sh build
