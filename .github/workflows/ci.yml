name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # bluetooth-serial-port is an optionalDependency: npm skips it where it cannot build
      # (esbuild's platform binaries are optional too, so --omit=optional would break tsx)
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js send idle --mock
      - run: node dist/cli.js update --check || test $? -eq 1
      - run: bash -n install.sh && bash -n uninstall.sh && ./install.sh --help
  python:
    name: bridge (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r bridge/requirements.txt ruff
      - run: ruff check bridge scripts
      - run: ruff format --check bridge scripts
      - run: python -m py_compile bridge/clawdbox_ble.py
  swift:
    name: menu bar app builds and reads the daemon
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: menubar/build.sh build
      # Run a real daemon against the mock panel and make sure the app renders its state.
      - name: menu bar app reports connection and current mode
        run: |
          set -o pipefail
          node dist/cli.js daemon --mock --port 7676 --hold-ms 0 > daemon.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:7676/health >/dev/null && break; sleep 0.2; done
          APP=menubar/build/Clawdbox.app/Contents/MacOS/Clawdbox
          echo "--- initial"; "$APP" --check | tee check1.txt
          grep -q '^connected: true' check1.txt
          grep -q '^transport: mock' check1.txt
          grep -q '^title: idle' check1.txt
          grep -q '^anims: 13 (idle: [1-9]' check1.txt
          grep -q '^Clawdbox [0-9]' check1.txt
          curl -sf -X POST http://127.0.0.1:7676/show/reading >/dev/null
          sleep 2
          mkdir -p shots
          echo "--- after forcing reading"; "$APP" --check --snapshot shots/digital-divoom.png | tee check2.txt
          grep -q '^anims: 13 (reading: [1-9]' check2.txt
          test -s shots/digital-divoom.png
          grep -q '^state: reading' check2.txt
          grep -q '^title: reading' check2.txt
          echo "--- launch the real menu bar app and read its status item"
          # --open-menu clicks the icon; CLAWDBOX_PANEL_LOG logs each frame the digital Divoom draws.
          CLAWDBOX_PANEL_LOG=1 "$APP" --no-daemon --open-menu >/dev/null 2>panel.log &
          sleep 8
          pgrep -x Clawdbox >/dev/null && echo "Clawdbox is running as a GUI app"
          # Read the live NSStatusItem title through the accessibility tree (may need permission on some runners).
          osascript -e 'tell application "System Events" to tell process "Clawdbox" to get value of attribute "AXTitle" of menu bar item 1 of menu bar 2' > statusitem.txt 2>&1 || true
          echo "status item title: $(cat statusitem.txt)"
          mkdir -p shots
          screencapture -x shots/menubar-full.png
          # crop the top-right of the menu bar where status items live
          sips -g pixelWidth -g pixelHeight shots/menubar-full.png | tail -2
          W=$(sips -g pixelWidth shots/menubar-full.png | awk '/pixelWidth/{print $2}')
          sips -c 80 900 --cropOffset 0 $((W-900)) shots/menubar-full.png --out shots/menubar-right.png >/dev/null
          sips -c 700 900 --cropOffset 0 $((W-900)) shots/menubar-full.png --out shots/menu-open-reading.png >/dev/null
          echo "--- change state while the menu is open"
          curl -sf -X POST http://127.0.0.1:7676/show/writing >/dev/null
          sleep 4
          screencapture -x shots/menu-open-writing-full.png
          sips -c 700 900 --cropOffset 0 $((W-900)) shots/menu-open-writing-full.png --out shots/menu-open-writing.png >/dev/null
          pkill -x Clawdbox || true
          echo "--- what the digital Divoom drew"; sort panel.log | uniq -c
          grep -q '^menu opened' panel.log
          # the open menu played several frames of the reading loop, then followed the daemon to writing
          test "$(grep 'state=reading .*inMenu=true' panel.log | sort -u | wc -l)" -ge 2
          test "$(grep 'state=writing .*inMenu=true' panel.log | sort -u | wc -l)" -ge 2
          echo "--- the digital Divoom as drawn (snapshot, then the open menu showing reading and writing)"
          python3 test/panel-ascii.py shots/digital-divoom.png --require-lit
          python3 test/panel-ascii.py shots/menubar-full.png --require-lit
          python3 test/panel-ascii.py shots/menu-open-writing-full.png --require-lit
          kill %1; sleep 1
          echo "--- daemon down"
          set +e; "$APP" --check > check3.txt; rc=$?; set -e
          cat check3.txt
          test "$rc" -ne 0
          grep -q '^title: offline' check3.txt
      # Last: on CI's detached HEAD the installer switches the checkout to main, which would
      # otherwise swap the daemon and test files under the steps above.
      - name: one-shot installer (build-only flags)
        run: ./install.sh --no-hooks --no-launchd --no-menubar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: menubar-screenshot
          path: |
            shots/
            statusitem.txt
            check*.txt
            panel.log
