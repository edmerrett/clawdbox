name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # bluetooth-serial-port is an optionalDependency: npm skips it where it cannot build
      # (esbuild's platform binaries are optional too, so --omit=optional would break tsx)
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js send idle --mock
  python:
    name: bridge (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r bridge/requirements.txt ruff
      - run: ruff check bridge scripts
      - run: ruff format --check bridge scripts
      - run: python -m py_compile bridge/clawdbox_ble.py
  swift:
    name: menu bar app builds and reads the daemon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: menubar/build.sh build
      # Run a real daemon against the mock panel and make sure the app renders its state.
      - name: menu bar app reports connection and current mode
        run: |
          set -o pipefail
          node dist/cli.js daemon --mock --port 7676 --hold-ms 0 > daemon.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:7676/health >/dev/null && break; sleep 0.2; done
          APP=menubar/build/Clawdbar.app/Contents/MacOS/Clawdbar
          echo "--- initial"; "$APP" --check | tee check1.txt
          grep -q '^connected: true' check1.txt
          grep -q '^transport: mock' check1.txt
          grep -q '^title: idle' check1.txt
          curl -sf -X POST http://127.0.0.1:7676/show/reading >/dev/null
          sleep 2
          echo "--- after forcing reading"; "$APP" --check | tee check2.txt
          grep -q '^state: reading' check2.txt
          grep -q '^title: reading' check2.txt
          echo "--- launch the real menu bar app and read its status item"
          open menubar/build/Clawdbar.app
          sleep 5
          pgrep -x Clawdbar >/dev/null && echo "Clawdbar is running as a GUI app"
          # Read the live NSStatusItem title through the accessibility tree (may need permission on some runners).
          osascript -e 'tell application "System Events" to tell process "Clawdbar" to get value of attribute "AXTitle" of menu bar item 1 of menu bar 2' > statusitem.txt 2>&1 || true
          echo "status item title: $(cat statusitem.txt)"
          mkdir -p shots
          screencapture -x shots/menubar-full.png
          # crop the top-right of the menu bar where status items live
          sips -g pixelWidth -g pixelHeight shots/menubar-full.png | tail -2
          W=$(sips -g pixelWidth shots/menubar-full.png | awk '/pixelWidth/{print $2}')
          sips -c 80 900 --cropOffset 0 $((W-900)) shots/menubar-full.png --out shots/menubar-right.png >/dev/null
          pkill -x Clawdbar || true
          kill %1; sleep 1
          echo "--- daemon down"
          set +e; "$APP" --check > check3.txt; rc=$?; set -e
          cat check3.txt
          test "$rc" -ne 0
          grep -q '^title: offline' check3.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menubar-screenshot
          path: |
            shots/
            statusitem.txt
            check*.txt
